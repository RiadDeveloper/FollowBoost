org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Match the proven PyRunner build config on this VM: the egress MITM proxy
# is slow to answer dependency downloads; give them 2 minutes instead of
# the 30s default before failing. Also compile Kotlin in-process (the
# Kotlin daemon hits the same IPv4/IPv6 socket problem as Gradle).
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.http.connectionTimeout=60000
kotlin.compiler.execution.strategy=in-process
